<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a363e"/>
      <stop offset="1" stop-color="#2c2830"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.87" cy="0.09" r="0.42">
      <stop offset="0" stop-color="#ffb45e" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ff9e6a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff9e6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brick" gradientUnits="userSpaceOnUse" x1="520" y1="540" x2="920" y2="170">
      <stop offset="0" stop-color="#e4559b"/>
      <stop offset="0.65" stop-color="#f07090"/>
      <stop offset="1" stop-color="#fb8d76"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="690" y1="310" x2="470" y2="660">
      <stop offset="0" stop-color="#e75da4"/>
      <stop offset="0.6" stop-color="#dd58ae"/>
      <stop offset="1" stop-color="#c754c8"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="42" y="42" width="940" height="940" rx="210"/>
    </clipPath>
  </defs>

  <rect x="42" y="42" width="940" height="940" rx="210" fill="url(#tile)"/>
  <rect x="42" y="42" width="940" height="940" rx="210" fill="url(#glow)"/>

  <g clip-path="url(#tileClip)">
    <!-- paint sweep from roller up to the brick area -->
    <path d="M 470 612 Q 478 400 700 316" fill="none" stroke="url(#sweep)"
          stroke-width="198" stroke-linecap="round"/>

    <!-- bricks: even right edge, ragged left edge merging into the sweep -->
    <g fill="url(#brick)">
      <rect x="600" y="176" width="190" height="74" rx="12"/>
      <rect x="808" y="176" width="105" height="74" rx="12"/>

      <rect x="500" y="268" width="190" height="74" rx="12"/>
      <rect x="708" y="268" width="190" height="74" rx="12"/>

      <rect x="570" y="360" width="190" height="74" rx="12"/>
      <rect x="778" y="360" width="135" height="74" rx="12"/>

      <rect x="672" y="452" width="190" height="74" rx="12"/>
    </g>

    <!-- handle: connector bar + grip -->
    <path d="M 336 580 L 292 700" stroke="#1b191d" stroke-width="26" stroke-linecap="round" fill="none"/>
    <rect x="241" y="675" width="58" height="150" rx="29" transform="rotate(27 270 750)"
          fill="#333037" stroke="#1b191d" stroke-width="20"/>

    <!-- roller -->
    <rect x="285" y="604" width="270" height="92" rx="46" transform="rotate(45 420 650)"
          fill="#b6b6bc" stroke="#1b191d" stroke-width="22"/>
  </g>
</svg>
